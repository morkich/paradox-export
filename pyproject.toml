[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paradox-export"
version = "1.0.0"
description = "Export Borland Paradox (.DB) tables to CSV, XLSX and XML — GUI + CLI, no ODBC/BDE required"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "paradox-export contributors" }]
keywords = ["paradox", "bde", "delphi", "csv", "xlsx", "export"]
classifiers = [
    "Development Status :: 5 - Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
paradox-export = "paradox_export.cli:main"
paradox-export-gui = "paradox_export.gui:main"

[project.urls]
Homepage = "https://github.com/morkich/paradox-export"

[tool.setuptools.packages.find]
where = ["src"]
